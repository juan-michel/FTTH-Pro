<script>
'use strict';
/* ---------- Base de datos (IndexedDB) ---------- */
let db;

function netLines(c){return ['📡 CAJA NAP',`- Caja NAP: ${val(napTxt(c))}`,`- Puerto: ${val(c.puerto)}`]}

  L.push('',`Realizado con: ${val(c.equipo.join(', '))}`);
  const i=new Date(c.instalacion);
  if(c.instalacion&&!isNaN(i))L.push(`Instalación: ${fmtDT(i)}`,`Garantía hasta ${fmtDate(warrantyEnd(c.instalacion))}`);
  if(c.notas)L.push('',`📝 Notas: ${c.notas}`);

/* ---------- ZIP (sin compresión) ---------- */
const CT=(()=>{const t=[];for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
function crc32(u){let c=~0;for(let i=0;i<u.length;i++)c=CT[(c^u[i])&255]^(c>>>8);return(~c)>>>0}
function makeZip(files){
  const enc=new TextEncoder(),parts=[],cen=[];let off=0;
  const d=new Date(),dt=(d.getHours()<<11)|(d.getMinutes()<<5)|(d.getSeconds()>>1),dd=((d.getFullYear()-1980)<<9)|((d.getMonth()+1)<<5)|d.getDate();
  for(const f of files){
    const nm=enc.encode(f.name),c=crc32(f.data),sz=f.data.length;
    const h=new DataView(new ArrayBuffer(30));
    h.setUint32(0,0x04034b50,true);h.setUint16(4,20,true);h.setUint16(6,0x0800,true);h.setUint16(8,0,true);h.setUint16(10,dt,true);h.setUint16(12,dd,true);
    h.setUint32(14,c,true);h.setUint32(18,sz,true);h.setUint32(22,sz,true);h.setUint16(26,nm.length,true);h.setUint16(28,0,true);
    parts.push(h.buffer,nm,f.data);
    const e=new DataView(new ArrayBuffer(46));
    e.setUint32(0,0x02014b50,true);e.setUint16(4,20,true);e.setUint16(6,20,true);e.setUint16(8,0x0800,true);e.setUint16(10,0,true);e.setUint16(12,dt,true);e.setUint16(14,dd,true);
    e.setUint32(16,c,true);e.setUint32(20,sz,true);e.setUint32(24,sz,true);e.setUint16(28,nm.length,true);e.setUint32(42,off,true);
    cen.push(e.buffer,nm);off+=30+nm.length+sz;
  }
  let cs=0;for(const p of cen)cs+=p.byteLength;
  const end=new DataView(new ArrayBuffer(22));
  end.setUint32(0,0x06054b50,true);end.setUint16(8,files.length,true);end.setUint16(10,files.length,true);end.setUint32(12,cs,true);end.setUint32(16,off,true);
  return new Blob([...parts,...cen,end.buffer],{type:'application/zip'});
}
async function clientFiles(c,all,base){
  base=base||folderName(c);
  const enc=new TextEncoder(),files=[];
  const meta=JSON.parse(JSON.stringify({...c,fotos:[],pdfs:[],fotosEt:{},_meta:[],_del:[],androids:c.androids.map(a=>({utpIni:a.utpIni,utpFin:a.utpFin,fotos:[]}))}));
  delete meta._meta;delete meta._del;delete meta.upd;
  const add=async(arr,dir,target,pre)=>{let i=1;for(const f of arr){const p=`${dir}/${pre||'foto'}_${pad(i++)}.jpg`;files.push({name:`${base}/${p}`,data:new Uint8Array(await f.blob.arrayBuffer())});target.push(p)}};
  await add(c.fotos,'fotos',meta.fotos);
  for(const k of Object.keys(SLOT_LABEL)){meta.fotosEt[k]=[];await add(c.fotosEt[k],k[0]==='e'?'fotos/externa':'fotos/interna',meta.fotosEt[k],safe(SLOT_LABEL[k]))}
  for(let i=0;i<3;i++)await add(c.androids[i].fotos,`android_${i+1}`,meta.androids[i].fotos);
  const names=new Set();
  for(const p of c.pdfs){let nm=(safe(p.name.replace(/\.pdf$/i,''))||'documento'),k=nm,i=2;while(names.has(k))k=nm+'_'+i++;names.add(k);const path=`pdf/${k}.pdf`;files.push({name:`${base}/${path}`,data:new Uint8Array(await p.blob.arrayBuffer())});meta.pdfs.push({name:p.name,path})}
  files.unshift({name:`${base}/resumen.txt`,data:enc.encode(summaryIn(c,all))},{name:`${base}/datos.json`,data:enc.encode(JSON.stringify(meta))});
  return files;
}

async function compress(file){
  try{
    const bmp=await createImageBitmap(file);const max=1280,k=Math.min(1,max/Math.max(bmp.width,bmp.height));
    const cv=document.createElement('canvas');cv.width=Math.round(bmp.width*k);cv.height=Math.round(bmp.height*k);
    cv.getContext('2d').drawImage(bmp,0,0,cv.width,cv.height);
    return await new Promise(r=>cv.toBlob(r,'image/jpeg',0.78));
  }catch(e){return file}
}

const r2=(n)=>Math.round(n*100)/100;
function agg(list){

  list.forEach(c=>{
    if(c.tipo==='asist'){r.asist++;r.con+=int(c.conectores);if(c.reserva)r.res++}
    else{if(isAdic(c))r.adic++;else r.inst++;const n=nAnd(c);r.android+=n;for(let i=0;i<n;i++)r.utp+=utpTotal(c.androids[i])||0}
    r.drop+=num(c.dropTotal)||0;r.tens+=int(c.tensores);r.grap+=int(c.grapas);r.pres+=int(c.presintos);
  });
  r.drop=r2(r.drop);r.utp=r2(r.utp);return r;
}
const dateOf=(c)=>{const d=new Date(c.tipo==='asist'?c.fechaAsist:c.instalacion);return isNaN(d)?null:d};

      key=+w;label=`Semana ${w.getDate()} ${MES3[w.getMonth()]} – ${e.getDate()} ${MES3[e.getMonth()]} ${e.getFullYear()}`}

}

async function readZip(buf){
  const dv=new DataView(buf),u8=new Uint8Array(buf),dec=new TextDecoder();
  let e=-1;for(let i=u8.length-22;i>=Math.max(0,u8.length-65557);i--){if(dv.getUint32(i,true)===0x06054b50){e=i;break}}
  if(e<0)throw new Error('ZIP inválido');
  const n=dv.getUint16(e+10,true);let p=dv.getUint32(e+16,true);const out=[];
  for(let i=0;i<n;i++){
    if(dv.getUint32(p,true)!==0x02014b50)break;
    const method=dv.getUint16(p+10,true),cs=dv.getUint32(p+20,true),nl=dv.getUint16(p+28,true),xl=dv.getUint16(p+30,true),cl=dv.getUint16(p+32,true),lo=dv.getUint32(p+42,true);
    const name=dec.decode(u8.subarray(p+46,p+46+nl));p+=46+nl+xl+cl;
    if(name.endsWith('/'))continue;
    const ds=lo+30+dv.getUint16(lo+26,true)+dv.getUint16(lo+28,true);
    out.push({name,method,raw:u8.subarray(ds,ds+cs)});
  }
  return out;
}
async function zipData(en){
  if(en.method===0)return en.raw;
  if(en.method===8){const s=new Blob([en.raw]).stream().pipeThrough(new DecompressionStream('deflate-raw'));return new Uint8Array(await new Response(s).arrayBuffer())}
  throw new Error('Compresión no soportada');
}

function parseResumen(text){
  const blocks=[];let b=null,andIdx=-1,skip=false,divider=false;
  const clean=(s)=>{s=s.trim();return s==='-'?'':s};
  const numv=(s)=>clean(s).replace(/\s*m$/i,'');
  for(const line of text.split(/\r?\n/)){
    const t=line.replace(/^[^\p{L}\p{N}]+/u,'').trim();
    if(!t)continue;
    let h=null;
    if(/^(nueva\s+)?instalaci[oó]n\s+ftth/i.test(t)){const a=t.match(/\+\s*(\d)\s*android/i);h=a?'a'+Math.min(3,+a[1]):'nueva'}
    else if(/^adici[oó]n\s+android/i.test(t)){const a=t.match(/(\d)\s*android/i);h='d'+(a?Math.min(3,Math.max(1,+a[1])):1)}
    else if(/^asistencia\s+ftth/i.test(t))h='asist';
    if(h){b=newClient(h);b.nested=divider;divider=false;blocks.push(b);andIdx=-1;skip=false;continue}
    if(/^perfil de la instalaci/i.test(t)){divider=true;continue}
    if(!b||skip)continue;
    if(/^asistencias\s*\(/i.test(t)){skip=true;continue}
    const am=t.match(/^android\s*(\d)\b/i);
    if(am&&!t.includes(':')){andIdx=+am[1]-1;continue}
    const mm=t.match(/^([^:]{1,40}):\s*(.*)$/);if(!mm)continue;
    const k=mm[1].toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim(),v=mm[2];
    const A=andIdx>=0&&andIdx<3?b.androids[andIdx]:null;
    switch(k){
      case 'cliente':b.nombre=clean(v);break;
      case 'celular':b.celulares=clean(v).split(/[\/,;]|\sy\s/).map(x=>x.replace(/\D/g,'')).filter(Boolean);if(!b.celulares.length)b.celulares=[''];break;
      case 'n de orden':case 'orden':b.orden=clean(v);break;
      case 'instalacion':case 'instalacion original':b.instalacion=parseDT(v)||b.instalacion;break;

  });

}
async function importFiles(fl){
  const existing=await dbAll();let added=0,updated=0,skipped=0,failed=0;
  const same=(a,b)=>a.tipo===b.tipo&&a.nombre.trim().toLowerCase()===b.nombre.trim().toLowerCase()&&a.orden===b.orden&&(a.tipo!=='asist'||a.fechaAsist===b.fechaAsist);
  const putParsed=async(list,extra)=>{
    list.forEach((c,i)=>{if(c.tipo==='asist'&&list[i+1]&&list[i+1].nested)c.vinculo=list[i+1].id});
    const top=list.find(c=>!c.nested),idMap={};
    for(const c of [...list].sort((a,b)=>(b.nested?1:0)-(a.nested?1:0))){
      const dup=existing.find(x=>same(x,c));
      if(dup){idMap[c.id]=dup.id;skipped++;continue}
      if(c.vinculo&&idMap[c.vinculo])c.vinculo=idMap[c.vinculo];
      if(c===top&&extra)await extra(c);
      delete c.nested;await dbPut(c);existing.push(c);added++;
    }
  };
  for(const f of fl){
    try{
      const isZip=/\.zip$/i.test(f.name)||/zip/.test(f.type);
      if(!isZip){await putParsed(parseResumen(await f.text()));continue}
      const entries=await readZip(await f.arrayBuffer());
      const groups={};
      const cf=entries.find(x=>x.name==='config.json');
      if(cf){try{const cfg=JSON.parse(new TextDecoder().decode(await zipData(cf)));if(cfg.tarifas&&typeof cfg.tarifas==='object'){Object.assign(tarifas,cfg.tarifas);saveTar()}}catch(e){}}
      for(const en of entries){const i=en.name.indexOf('/');const top=i<0?'':en.name.slice(0,i),rel=i<0?en.name:en.name.slice(i+1);(groups[top]=groups[top]||[]).push({rel,en})}
      for(const g of Object.values(groups)){
        const find=(rel)=>g.find(x=>x.rel===rel);
        const blobOf=async(p)=>{const x=find(p);return x?new Blob([await zipData(x.en)],{type:mimeOf(p)}):null};
        const photos=async(paths)=>{const o=[];for(const p of paths||[]){const bl=await blobOf(p);if(bl)o.push({id:pid(),blob:bl})}return o};
        const jf=find('datos.json');
        if(jf){
          const meta=JSON.parse(new TextDecoder().decode(await zipData(jf.en)));
          const c=meta;c.fotos=await photos(meta.fotos);{const fe={};for(const k of Object.keys(SLOT_LABEL))fe[k]=await photos((meta.fotosEt||{})[k]);c.fotosEt=fe}
          c.androids=await Promise.all((meta.androids||[]).map(async a=>({utpIni:a.utpIni||'',utpFin:a.utpFin||'',fotos:await photos(a.fotos)})));
          const pdfs=[];for(const p of meta.pdfs||[]){const x=find(p.path);if(x)pdfs.push({id:pid(),name:p.name,blob:new Blob([await zipData(x.en)],{type:'application/pdf'})})}
          c.pdfs=pdfs;norm(c);
          if(existing.some(x=>x.id===c.id))updated++;else added++;
          await dbPut(c);const ix=existing.findIndex(x=>x.id===c.id);if(ix>=0)existing[ix]=c;else existing.push(c);
          continue;
        }
        const rf=find('resumen.txt')||g.find(x=>/\.txt$/i.test(x.rel));
        if(!rf)continue;
        const list=parseResumen(new TextDecoder().decode(await zipData(rf.en)));
        await putParsed(list,async(c)=>{
          const by=(re)=>g.filter(x=>re.test(x.rel)).sort((a,b)=>a.rel.localeCompare(b.rel)).map(x=>x.rel);
          c.fotos=await photos(by(/^fotos\/(?!externa\/|interna\/)/i));
          for(let i=0;i<3;i++)c.androids[i].fotos=await photos(by(new RegExp('^android_'+(i+1)+'/','i')));
          for(const p of by(/^pdf\/.*\.pdf$/i)){const x=find(p);c.pdfs.push({id:pid(),name:p.split('/').pop(),blob:new Blob([await zipData(x.en)],{type:'application/pdf'})})}
        });
      }
    }catch(e){failed++;console.error(e)}
  }
  toast(`Importados: ${added}${updated?` · Actualizados: ${updated}`:''}${skipped?` · Omitidos (ya existían): ${skipped}`:''}${failed?` · Con error: ${failed}`:''}`);
  showList();
}

function getArr(c,path){
  if(path==='fotos')return c.fotos;if(path==='pdf')return c.pdfs;
  if(path.startsWith('et.'))return c.fotosEt[path.slice(3)]||(c.fotosEt[path.slice(3)]=[]);
  if(path.startsWith('and.'))return(c.androids[+path.slice(4)]||{}).fotos||null;

function allArrays(c){return[c.fotos,c.pdfs,...Object.values(c.fotosEt),...c.androids.map(a=>a.fotos)]}
function orderByMeta(c){

  allArrays(c).forEach(a=>a.sort((x,y)=>(ix.has(x.id)?ix.get(x.id):1e9)-(ix.has(y.id)?ix.get(y.id):1e9)));

function manifestOf(c){

  eachPhoto(c,(path,p,kind)=>{have.add(p.id);if(p.up)m.push({id:p.id,path,kind,name:p.name||''})});

function mergeLocal(rec,l){

let syncing=false,syncT=null,syncErr='';
function queueSync(){if(!cloud||!cloud.auto||!navigator.onLine)return;clearTimeout(syncT);syncT=setTimeout(()=>syncNow(true),3000)}
async function syncNow(silent){
  if(!cloud||syncing)return;
  if(!navigator.onLine){if(!silent)toast('Sin internet');return}
  syncing=true;syncErr='';
  try{
    cloud.perms=await rpc('ftth_auth',{p_code:cloud.code});applyPerms();
    cloud.pushed=cloud.pushed||{};
    /* 1) bajar */
    const rows=await rpc('ftth_pull',{p_code:cloud.code,p_since:cloud.srv||0});
    const local=new Map((await dbAll()).map(c=>[c.id,c]));const tb=tombs();let maxSrv=cloud.srv||0,changed=0;
    for(const r of rows){
      maxSrv=Math.max(maxSrv,r.srv);const l=local.get(r.id);
      if(r.deleted){
        if(l&&(l.upd||0)<=r.upd){await dbDelRaw(r.id);changed++}
        if(!l||(l.upd||0)<=r.upd){delete tb[r.id];cloud.pushed[r.id]=r.upd}
        continue;
      }
      if(l&&(l.upd||0)>=r.upd)continue;
      if(!l&&tb[r.id]&&tb[r.id]>=r.upd)continue;     // lo borré aquí después
      delete tb[r.id];
      const rec=norm(r.data);rec.upd=r.upd;rec._meta=r.data._meta||[];
      if(l)mergeLocal(rec,l);
      await dbPutRaw(rec);cloud.pushed[r.id]=r.upd;changed++;
    }
    try{localStorage.setItem(TK,JSON.stringify(tb))}catch(e){}
    /* 2) subir */
    let pushedN=0;
    if(can.edit){
      const out=[],uploaded=new Set();
      for(const c of await dbAll()){
        if((cloud.pushed[c.id]||0)>=(c.upd||0))continue;
        const mine=new Set();
        const todo=[];eachPhoto(c,(path,p,kind)=>{if(!p.up)todo.push({p,kind})});
        for(const it of todo){
          if(it.kind==='pdf'&&it.p.blob.size>3e6)continue;
          await rpc('ftth_foto_put',{p_code:cloud.code,p_id:it.p.id,p_registro:c.id,p_kind:it.kind,p_name:it.p.name||'',p_data:await blobToDataURL(it.p.blob)});
          it.p.up=true;mine.add(it.p.id);uploaded.add(it.p.id);
        }
        if(mine.size)await markUp(c.id,mine);
        out.push({id:c.id,upd:c.upd||0,deleted:false,data:serialize(c)});
      }
      for(const [id,upd] of Object.entries(tombs()))out.push({id,upd,deleted:true});
      for(let i=0;i<out.length;i+=15)await rpc('ftth_push',{p_code:cloud.code,p_rows:out.slice(i,i+15)});
      out.forEach(r=>{cloud.pushed[r.id]=r.upd});pushedN=out.length;
      try{localStorage.removeItem(TK)}catch(e){}
      if(cur&&uploaded.size)eachPhoto(cur,(_,p)=>{if(uploaded.has(p.id))p.up=true});
    }
    cloud.srv=maxSrv;cloud.last=Date.now();saveCloud();
    if(!silent)toast(`Sincronizado · ${changed} recibidos · ${pushedN} enviados`);
    if(!cur&&(changed||origin==='cloud')&&!(document.activeElement&&document.activeElement.id==='q')){
      ({list:showList,report:showReport,team:showTeam,cal:showCal,cloud:showCloud}[origin]||showList)();
    }
  }catch(e){
    syncErr=errTxt(e);if(!silent)toast('⚠ '+syncErr);
    if(String(e.message)==='codigo_invalido'&&cloud.role==='link'){/* enlace revocado: se queda en lectura */}
  }finally{syncing=false;if(origin==='list'&&!cur){const n=$('#notes');if(n)n.innerHTML=notesHTML()}}
}

    <button class="s" data-act="cl_disc">Desconectar este equipo (conserva tus datos)</button></div>
    <div class="card"><h2>Compartir con un enlace</h2>
    <div class="rsub">Elige qué podrá hacer quien abra el enlace. Puedes revocarlo cuando quieras.</div>
    <label>Dirección donde está publicada la app</label><input id="cl_app" type="url" placeholder="https://tuusuario.github.io/ftth/" value="${esc(cloud.app||(/^https?:/.test(location.protocol)?location.href.split('#')[0]:''))}" autocomplete="off">
    <label>Nombre de la persona</label><input id="cl_name" type="text" placeholder="Ej. Socio, Contador…" autocomplete="off">
    <label class="chk"><input type="checkbox" checked disabled> Ver clientes</label>
    <label class="chk" style="margin-top:6px"><input type="checkbox" id="cl_editar"> Puede agregar y editar</label>
    <label class="chk" style="margin-top:6px"><input type="checkbox" id="cl_fotos"> Puede ver fotos y PDF</label>
    <label class="chk" style="margin-top:6px"><input type="checkbox" id="cl_pagos"> Puede ver pagos y ganancias</label>
    <button class="p" data-act="cl_mklink">Crear enlace</button><div id="cl_new"></div></div>
    <div class="card"><h2>Enlaces creados</h2><div id="cl_links" class="rsub">Cargando…</div></div>`;
  }
  m.innerHTML=h;
}
async function loadLinks(){
  const el=$('#cl_links');if(!el)return;
  try{
    const list=await rpc('ftth_link_list',{p_owner:cloud.code});const mine=myLinks();
    const rows=await Promise.all(list.map(async l=>({l,own:mine.find(x=>x.hash===l.hash)})));
    el.innerHTML=list.length?rows.map(({l,own})=>`<div class="trow" style="cursor:default;${l.revocado?'opacity:.5':''}"><div style="min-width:0"><b>${esc(l.nombre)}</b>${l.revocado?' · revocado':''}<div class="rsub">${permTxt(l)} · ${fd(l.creado)}</div></div>
      <div style="display:flex;gap:6px;flex:none">${!l.revocado&&own?`<button class="s sm" data-act="cl_copy" data-h="${l.hash}">Copiar</button>`:''}${!l.revocado?`<button class="d sm" data-act="cl_revoke" data-h="${l.hash}">Revocar</button>`:''}</div></div>`).join(''):'Aún no creaste enlaces.';
  }catch(e){el.textContent='⚠ '+errTxt(e)}
}
function linkFor(code,name){
  const base=(cloud.app||'').trim()||location.href.split('#')[0];
  return base.replace(/#.*$/,'')+'#share='+encodeURIComponent(b64e({u:cloud.u,k:cloud.k,c:code,n:name||''}));
}
async function shareText(text){
  try{if(navigator.share){await navigator.share({text});return}}catch(e){if(e.name==='AbortError')return}
  try{await navigator.clipboard.writeText(text);toast('Enlace copiado')}catch(e){window.prompt('Copia el enlace:',text)}
}
async function cloudAction(act,d){
  if(act==='cl_open')return showCloud();
  if(act==='cl_sync'){toast('Sincronizando…');await syncNow(false);return drawCloud()}
  if(act==='cl_connect'){
    const u=$('#cl_url').value.trim(),k=$('#cl_key').value.trim(),c=$('#cl_code').value;
    if(!/^https?:\/\//.test(u)||!k||c.length<10){toast('Completa la URL, la clave y un código de 10+ caracteres');return}
    cloud={u,k,code:c,role:'owner',auto:true,srv:0,pushed:{},perms:null};
    try{toast('Conectando…');await rpc('ftth_init',{p_code:c});applyPerms();saveCloud();await syncNow(false)}
    catch(e){const msg=errTxt(e);cloud=null;applyPerms();toast('⚠ '+msg)}
    return drawCloud();
  }
  if(act==='cl_disc'){if(confirm('¿Desconectar este equipo de la nube? Tus datos locales se conservan.')){cloud=null;saveCloud();applyPerms();toast('Desconectado')}return drawCloud()}
  if(act==='cl_leave'){if(confirm('Se borrarán de este equipo los datos compartidos. ¿Continuar?')){await wipeLocal();cloud=null;saveCloud();applyPerms();toast('Saliste del modo compartido');return showList()}return}
  if(act==='cl_mklink'){
    const name=$('#cl_name').value.trim()||'Enlace',ed=$('#cl_editar').checked,fo=$('#cl_fotos').checked,pa=$('#cl_pagos').checked;
    cloud.app=$('#cl_app').value.trim();saveCloud();
    if(!/^https?:\/\//.test(cloud.app)){toast('Escribe la dirección pública de la app (https://…)');return}
    const code=randCode();
    try{
      await rpc('ftth_link_create',{p_owner:cloud.code,p_nombre:name,p_code:code,p_editar:ed,p_fotos:fo,p_pagos:pa});
      let hash='';try{hash=await sha256hex(code)}catch(e){}
      if(hash){const l=myLinks();l.push({hash,code,name});try{localStorage.setItem(LK,JSON.stringify(l))}catch(e){}}
      const url=linkFor(code,name);
      $('#cl_new').innerHTML=`<div class="warn" style="color:var(--tx);margin-top:10px"><b>Enlace listo</b> (${permTxt({editar:ed,fotos:fo,pagos:pa})})</div><pre style="margin-top:6px;font-size:12px">${esc(url)}</pre><div class="two"><button class="p" data-act="cl_share" data-u="${esc(url)}" style="margin:8px 0 0">Compartir</button></div>`;
      loadLinks();
    }catch(e){toast('⚠ '+errTxt(e))}
    return;
  }
  if(act==='cl_share')return shareText(d.u);
  if(act==='cl_copy'){const o=myLinks().find(x=>x.hash===d.h);if(o)shareText(linkFor(o.code,o.name));return}
  if(act==='cl_revoke'){if(!confirm('¿Revocar este enlace? Quien lo tenga dejará de ver los datos.'))return;try{await rpc('ftth_link_revoke',{p_owner:cloud.code,p_hash:d.h});toast('Enlace revocado')}catch(e){toast('⚠ '+errTxt(e))}return loadLinks()}
}
async function wipeLocal(){await rq(store('readwrite').clear());try{localStorage.removeItem(TK)}catch(e){}}
function acceptShareLink(){
  const mt=location.hash.match(/share=([^&]+)/);if(!mt)return;
  try{
    const o=b64d(decodeURIComponent(mt[1]));if(!o.u||!o.k||!o.c)throw 0;
    history.replaceState(null,'',location.pathname+location.search);
    const hasData=localStorage.getItem('ftth_has')==='1';
    if(cloud&&cloud.role==='owner'&&!confirm('Este enlace reemplazará la conexión de nube de este equipo. ¿Continuar?'))return;
    if(!cloud&&hasData&&!confirm('Este equipo ya tiene clientes guardados. Al abrir el enlace se mezclarán con los compartidos. ¿Continuar?'))return;
    cloud={u:o.u,k:o.k,code:o.c,role:'link',name:o.n||'',auto:true,srv:0,pushed:{},perms:null};saveCloud();applyPerms();
    toast('Enlace aceptado · sincronizando…');
  }catch(e){toast('El enlace no es válido')}
}

/* ---------- Eventos ---------- */
m.addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset.rate){const v=t.value.replace(/[^\d.,]/g,'');if(v!==t.value)t.value=v;const n=num(v);if(n===null)delete tarifas[t.dataset.rate];else tarifas[t.dataset.rate]=n;saveTar();const e=$('#earn');if(e)e.innerHTML=earnHTML();const dd=$('#cday');if(dd)dd.innerHTML=dayHTML(calMap());return}
  if(t.id==='sq'){drawResults();return}
  const k=t.dataset.k;if(!k||!cur)return;
  if(t.dataset.d!==undefined){const v=t.value.replace(/\D/g,'');if(v!==t.value)t.value=v}
  else if(t.dataset.dec!==undefined){const v=t.value.replace(/[^\d.,]/g,'');if(v!==t.value)t.value=v}
  const v=t.type==='checkbox'?t.checked:t.value;
  if(t.dataset.a!==undefined){const i=+t.dataset.a;cur.androids[i][k]=v;updUtp(i)}
  else if(t.dataset.p!==undefined){cur.celulares[+t.dataset.p]=v}
  else{
    cur[k]=v;
    if(k==='dropIni'||k==='dropFin')autoTotal();
    if(k==='dropTotal'){cur.totalManual=v!=='';if(!cur.totalManual)autoTotal()}
    if(k==='nombre')ttl.textContent=cur.nombre||(cur.tipo==='asist'?'Nueva asistencia':'Nuevo cliente');
    if(k==='ubicacion')updLoc();
    if(k==='pagoFecha'&&v&&!cur.pagoMes){cur.pagoMes=(cur.instalacion||v).slice(0,7);const b2=$('#f_pagoMes');if(b2)b2.value=cur.pagoMes}
  }
  refresh();save();
});
document.addEventListener('change',async e=>{
  const t=e.target;if(t.id!=='fi'||!cur)return;
  const files=[...t.files];if(!files.length)return;
  toast('Procesando fotos…');
  const arr=photoArr(fiKey),key=fiKey;
  for(const fl of files)arr.push({id:'p'+Date.now()+Math.random().toString(36).slice(2,6),blob:await compress(fl)});

const RO_OK=new Set(['open','flt','tab','theme','calprev','calnext','caltoday','calday','tmprev','tmnext','tmall','tmcopy','rtab','rwho','rcopy','report','team','cp','sh','zp','lwa','lzip','wa','gmaps','gearth','route','img','openpdf','openlk','export']);
document.addEventListener('click',async e=>{
  if(e.target.id==='sheet'){$('#sheet').style.display='none';return}
  const b=e.target.closest('[data-act]');if(!b)return;
  const d=b.dataset;
  if(d.act.startsWith('cl_')){$('#sheet').style.display='none';return cloudAction(d.act,d)}
  if(!can.edit&&!RO_OK.has(d.act)){toast('Solo lectura: no tienes permiso para editar');return}
  switch(d.act){
    case 'new':return openProfile(newClient('nueva'));
    case 'newas':return openProfile(newClient('asist'));
    case 'open':return openProfile(listCache.find(x=>x.id===d.id));
    case 'flt':flt=d.v;return drawList();
    case 'tipo':return openSheet();
    case 'settipo':return setTipo(d.v);
    case 'addtel':if(cur.celulares.length<5){cur.celulares.push('');$('#phs').innerHTML=phonesHTML();const ins=document.querySelectorAll('#phs input');ins[ins.length-1].focus()}return;
    case 'deltel':cur.celulares.splice(+d.p,1);$('#phs').innerHTML=phonesHTML();refresh();save();return;
    case 'wa':{const n=waNum(cur.celulares[+d.p]);if(!n){toast('Escribe el número primero');return}openWA(n);return}
    case 'paste':return pasteLoid();
    case 'add':if(!can.edit||!can.fotos)return;if(!cur.nombre.trim()){alert('Primero escribe el nombre del cliente.');return}fiKey=d.key;$('#fi').click();return;
    case 'img':{ov={key:d.key,i:+d.i};const u=URL.createObjectURL(photoArr(d.key)[+d.i].blob);urls.push(u);$('#ovi').src=u;$('#ov').style.display='flex';return}
    case 'falla':{const f=FALLAS[+d.i],ix=cur.fallas.indexOf(f);if(ix>=0)cur.fallas.splice(ix,1);else cur.fallas.push(f);b.classList.toggle('on');refresh();save();return}
    case 'pick':return linkTo(d.id);
    case 'unlink':cur.vinculo='';if(linked)cur.instalacion=linked.instalacion;linked=null;await saveNow();renderForm();return;
    case 'openlk':{const lk=linked;await saveNow();return openProfile(lk)}
    case 'cp':{const txt=summaryIn(cur,allCache);try{await navigator.clipboard.writeText(txt)}catch(_){const r=document.createRange();r.selectNode($('#rs'));getSelection().removeAllRanges();getSelection().addRange(r);document.execCommand('copy')}toast('Resumen copiado');return}
    case 'sh':{
      const text=summaryIn(cur,allCache);
      try{
        const files=photoItems(cur).map(p=>new File([p.blob],p.name+'.jpg',{type:'image/jpeg'})).concat(cur.pdfs.map(p=>new File([p.blob],p.name,{type:'application/pdf'})));
        if(files.length&&navigator.canShare&&navigator.canShare({files})){await navigator.share({text,files});return}
        if(navigator.share){await navigator.share({text});return}
      }catch(err){if(err.name==='AbortError')return}
      window.open('https://wa.me/?text='+encodeURIComponent(text),'_blank');return}
    case 'zp':{
      if(!cur.nombre.trim()){alert('Escribe el nombre del cliente.');return}
      toast('Generando carpeta…');await saveNow();const all=await dbAll();
      download(makeZip(await clientFiles(cur,all)),folderName(cur)+'.zip');return}
    case 'lwa':{const c=listCache.find(x=>x.id===d.id),n=c?waNum(c.celulares.find(x=>x.trim())||''):'';if(!n){toast('Este cliente no tiene celular');return}openWA(n);return}
    case 'lzip':{const c=listCache.find(x=>x.id===d.id);toast('Generando carpeta…');download(makeZip(await clientFiles(c,listCache)),folderName(c)+'.zip');return}
    case 'ldel':{const c=listCache.find(x=>x.id===d.id);if(c&&confirm(`¿Eliminar a ${c.nombre||'este perfil'} y sus fotos? No se puede deshacer.`)){await dbDel(c.id);toast('Perfil eliminado');showList()}return}
    case 'eq':{const nm=INSTALADORES[+d.i],ix=cur.equipo.indexOf(nm);if(ix>=0)cur.equipo.splice(ix,1);else cur.equipo.push(nm);b.classList.toggle('on');refresh();save();return}
    case 'theme':$('#sheet').style.display='none';return toggleTheme();
    case 'team':$('#sheet').style.display='none';return showTeam();
    case 'tmprev':tm.all=false;tm.m--;if(tm.m<0){tm.m=11;tm.y--}return drawTeam();
    case 'tmnext':tm.all=false;tm.m++;if(tm.m>11){tm.m=0;tm.y++}return drawTeam();
    case 'tmall':tm.all=!tm.all;return drawTeam();
    case 'tmcopy':{const t=teamText();try{await navigator.clipboard.writeText(t)}catch(_){const ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove()}toast('Copiado');return}
    case 'dtnow':case 'dttom':{const x=new Date();if(d.act==='dttom'){x.setDate(x.getDate()+1);x.setHours(8,0,0,0)}const v=toLocalStr(x);cur[d.k]=v;const el=$('#f_'+d.k);if(el)el.value=v;refresh();save();return}
    case 'nap':cur.napLet=cur.napLet===d.v?'':d.v;b.parentNode.querySelectorAll('.chip').forEach(x=>x.classList.toggle('on',x.dataset.v===cur.napLet));refresh();save();return;
    case 'gmaps':case 'gearth':{const p=parseCoords(cur.ubicacion);if(!p){toast('Escribe las coordenadas: -21.535330,-64.733627');return}window.open(d.act==='gmaps'?mapsUrl(p):earthUrl(p),'_blank');return}
    case 'pasteu':return pasteInto('ubic');
    case 'route':{const p=parseCoords(cur.ubicacion);if(!p){toast('Escribe o captura las coordenadas primero');return}window.open(routeUrl(p),'_blank');return}
    case 'gps':{
      if(!navigator.geolocation){toast('Este equipo no permite usar la ubicación');return}
      if(parseCoords(cur.ubicacion)&&!confirm('Ya hay coordenadas. ¿Reemplazarlas por tu ubicación actual?'))return;
      toast('Buscando tu ubicación…');
      navigator.geolocation.getCurrentPosition(pos=>{
        const v=pos.coords.latitude.toFixed(6)+','+pos.coords.longitude.toFixed(6);
        cur.ubicacion=v;const el=$('#f_ubicacion');if(el)el.value=v;updLoc();refresh();save();toast('Ubicación guardada'+(pos.coords.accuracy?` (±${Math.round(pos.coords.accuracy)} m)`:''));
      },err=>toast(err.code===1?'Permiso de ubicación denegado':'No se pudo obtener la ubicación'),{enableHighAccuracy:true,timeout:20000,maximumAge:0});
      return}
    case 'pgnow':{const t=new Date();cur.pagoFecha=`${t.getFullYear()}-${pad(t.getMonth()+1)}-${pad(t.getDate())}`;if(!cur.pagoMes)cur.pagoMes=(cur.instalacion||cur.pagoFecha).slice(0,7);const a=$('#f_pagoFecha'),b2=$('#f_pagoMes');if(a)a.value=cur.pagoFecha;if(b2)b2.value=cur.pagoMes;refresh();save();return}
    case 'pgclr':{cur.pagoFecha='';cur.pagoMes='';const a=$('#f_pagoFecha'),b2=$('#f_pagoMes');if(a)a.value='';if(b2)b2.value='';refresh();save();return}
    case 'calprev':cal.m--;if(cal.m<0){cal.m=11;cal.y--}cal.sel=null;return drawCal();
    case 'calnext':cal.m++;if(cal.m>11){cal.m=0;cal.y++}cal.sel=null;return drawCal();
    case 'caltoday':{const t=new Date();cal.y=t.getFullYear();cal.m=t.getMonth();cal.sel=dkey(t);return drawCal()}
    case 'calday':{const y=window.scrollY;cal.sel=d.k;drawCal();window.scrollTo(0,y);return}
    case 'tab':{if(d.v==='clientes'){flt='all';return showList()}if(d.v==='asist'){flt='asist';return showList()}if(d.v==='mat')return showReport();if(d.v==='cal')return showCal();return showTeam()}
    case 'report':$('#sheet').style.display='none';return showReport();
    case 'rtab':rp.tab=d.v;return drawReport();
    case 'rwho':rp.who=d.v;return drawReport();
    case 'rcopy':{const t=repText();try{await navigator.clipboard.writeText(t)}catch(_){const ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove()}toast('Resumen copiado');return}
    case 'export':$('#sheet').style.display='none';return exportAll();
    case 'import':$('#sheet').style.display='none';$('#imp').click();return;
    case 'camscan':location.href='intent:#Intent;package=com.intsig.camscanner;S.browser_fallback_url=https%3A%2F%2Fplay.google.com%2Fstore%2Fapps%2Fdetails%3Fid%3Dcom.intsig.camscanner;end';return;
    case 'addpdf':if(!cur.nombre.trim()){alert('Primero escribe el nombre del cliente.');return}$('#fpdf').click();return;
    case 'openpdf':{const u=URL.createObjectURL(cur.pdfs[+d.i].blob);urls.push(u);window.open(u,'_blank');return}
    case 'delpdf':if(confirm('¿Quitar este PDF?')){const [dp]=cur.pdfs.splice(+d.i,1);if(dp&&dp.up)cur._del.push(dp.id);await saveNow();drawPdfs()}return;
    case 'del':if(confirm('¿Eliminar este perfil y sus fotos? No se puede deshacer.')){clearTimeout(saveT);const did=cur.id;cur=null;await dbDel(did);toast('Perfil eliminado');showList()}return;
  }
});
